name: Daily Git Lesson PR

on:
  schedule:
    - cron: '0 16 * * *'  # 9 PM PKT (UTC+5)
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  create-and-approve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create lesson and PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/create_lesson_pr.sh
          export DATE=$(date -u +%Y-%m-%d)
          bash scripts/create_lesson_pr.sh

      - name: Auto approve and merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_URL=$(cat pr_url.txt)
          gh pr review "$PR_URL" --approve
          gh pr merge "$PR_URL" --auto --merge
